name: k8s build & deploy (pdf-forge prod)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in quick succession would otherwise race on the platform-repo
# Contents API PUT (read sha -> PUT) and one bump would be lost with a 409.
concurrency:
  group: pdf-forge-prod-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.cloudfares.net/platform/pdf-forge
      VALUES_FILE: apps/pdf-forge.yaml
      PLATFORM_REPO: MohammaedAlani/cloudfares-platform
      PLATFORM_BRANCH: prod
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cloudfares.net
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:prod
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Bump tag in platform values via Contents API
        env:
          PLATFORM_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          set -e
          RESP=$(curl -fsSL -H "Authorization: token $PLATFORM_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PLATFORM_REPO/contents/$VALUES_FILE?ref=$PLATFORM_BRANCH")
          OLD_B64=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['content'].replace('\n',''))")
          OLD_SHA=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
          OLD=$(echo "$OLD_B64" | base64 -d)
          NEW=$(echo "$OLD" | python3 -c "
          import re,sys
          s=sys.stdin.read()
          sys.stdout.write(re.sub(r'(\nimage:\n(?:[^\n]*\n)*?\s*tag:\s*)\S+',lambda m:m.group(1)+'$SHA',s,count=1))")
          if [ "$OLD" = "$NEW" ]; then echo "no tag change"; exit 0; fi
          NEW_B64=$(echo "$NEW" | base64 -w0)
          curl -fsSL -X PUT -H "Authorization: token $PLATFORM_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PLATFORM_REPO/contents/$VALUES_FILE" \
            -d "{\"message\":\"pdf-forge prod: bump to $SHA\",\"content\":\"$NEW_B64\",\"sha\":\"$OLD_SHA\",\"branch\":\"$PLATFORM_BRANCH\"}" \
            -o /dev/null -w "  PUT $VALUES_FILE -> HTTP %{http_code}\n"

      # Without this the pipeline is green the moment the tag is bumped, and a
      # broken ArgoCD (unlisted destination namespace, bad project, missing
      # path) is invisible. prod-pdf-forge sat Unknown/Unknown for 130 days
      # exactly this way while every run here reported success.
      - name: Verify the new build is actually serving
        env:
          HEALTH_URL: https://pdf.cloudfares.net/health
          TIMEOUT_SECONDS: '600'
          POLL_SECONDS: '10'
        run: |
          set -u
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
          live=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            live=$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null               | python3 -c "import sys,json;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo "")
            if [ "$live" = "$SHA" ]; then
              echo "deployed: $HEALTH_URL reports $live"
              exit 0
            fi
            echo "waiting for rollout - live='$live' want='$SHA'"
            sleep "$POLL_SECONDS"
          done
          echo "::error::Image was pushed and the tag was bumped, but $HEALTH_URL still reports '$live' after ${TIMEOUT_SECONDS}s (expected '$SHA')."
          echo "::error::ArgoCD has not rolled this out. Check: kubectl -n argocd get app prod-pdf-forge -o jsonpath='{.status.conditions[*].message}'"
          exit 1
