name: k8s build & deploy (pdf-forge prod)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.cloudfares.net/platform/pdf-forge
      VALUES_FILE: apps/pdf-forge.yaml
      PLATFORM_REPO: MohammaedAlani/cloudfares-platform
      PLATFORM_BRANCH: prod
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cloudfares.net
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:prod
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Bump tag in platform values via Contents API
        env:
          PLATFORM_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          set -e
          RESP=$(curl -fsSL -H "Authorization: token $PLATFORM_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PLATFORM_REPO/contents/$VALUES_FILE?ref=$PLATFORM_BRANCH")
          OLD_B64=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['content'].replace('\n',''))")
          OLD_SHA=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
          OLD=$(echo "$OLD_B64" | base64 -d)
          NEW=$(echo "$OLD" | python3 -c "
          import re,sys
          s=sys.stdin.read()
          sys.stdout.write(re.sub(r'(\nimage:\n(?:[^\n]*\n)*?\s*tag:\s*)\S+',lambda m:m.group(1)+'$SHA',s,count=1))")
          if [ "$OLD" = "$NEW" ]; then echo "no tag change"; exit 0; fi
          NEW_B64=$(echo "$NEW" | base64 -w0)
          curl -fsSL -X PUT -H "Authorization: token $PLATFORM_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PLATFORM_REPO/contents/$VALUES_FILE" \
            -d "{\"message\":\"pdf-forge prod: bump to $SHA\",\"content\":\"$NEW_B64\",\"sha\":\"$OLD_SHA\",\"branch\":\"$PLATFORM_BRANCH\"}" \
            -o /dev/null -w "  PUT $VALUES_FILE -> HTTP %{http_code}\n"
